        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .empty-state { text-align: center; padding: 40px; color: #a0aec0; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 40px; font-size: 14px; z-index: 1100; display: none; }
        .toast.show { display: block; }
        .guest-banner { background: #fff3cd; padding: 12px 16px; margin: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .mode-buttons { display: flex; gap: 12px; margin: 16px; }
        .mode-btn { flex: 1; padding: 12px; border: none; border-radius: 16px; font-size: 14px; font-weight: 600; cursor: pointer; background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .mode-btn.active { background: #667eea; color: white; }
        .custom-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 16px; text-align: center; z-index: 2000; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: none; flex-direction: column; gap: 16px; min-width: 280px; }
        .custom-toast.show { display: flex; }
        .custom-toast button { padding: 10px; margin: 0 8px; border-radius: 8px; cursor: pointer; }
        .datetime-confirm { background: #e8f5e9; padding: 8px; border-radius: 8px; text-align: center; margin-top: 8px; font-size: 13px; color: #2e7d32; }
        .pending-badge { background: #ed8936; color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .approved-badge { background: #48bb78; color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .rejected-badge { background: #f56565; color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; }
        .notification-bell { position: relative; cursor: pointer; }
        .notification-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; min-width: 18px; text-align: center; }
        .notification-item { padding: 12px; border-bottom: 1px solid #e2e8f0; cursor: pointer; transition: background 0.2s; }
        .notification-item:hover { background: #f7fafc; }
        .notification-item.unread { background: #ebf8ff; }
        .notification-item .time { font-size: 11px; color: #a0aec0; margin-top: 4px; }
        .notification-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .mark-all-read { font-size: 12px; color: #667eea; cursor: pointer; }
        .notification-icon { font-size: 20px; background: rgba(255,255,255,0.2); padding: 6px 10px; border-radius: 30px; }
        .mode-toggle { display: flex; gap: 10px; margin: 16px; background: white; border-radius: 40px; padding: 6px; }
        .mode-toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: #667eea; transition: all 0.2s; }
        .mode-toggle-btn.active { background: #667eea; color: white; }
        .forgot-link { text-align: center; margin-top: 12px; font-size: 13px; }
        .forgot-link span { color: #667eea; cursor: pointer; text-decoration: underline; }

    <script type="module">
        import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        
        const db = getDatabase();
        const auth = getAuth();
        
        let currentUser = null;
        let currentMode = 'resident';
        let adminMode = 'admin';
        let isSecurityLoggedIn = false;
        let allUsers = [];
        let allSlots = [];
        let allBookings = [];
        let allNotifications = [];
        
        const SECURITY_PASSWORD = "amaatra123";
        
        // ============ SOCIETY CONFIGURATION ============
        const SOCIETY_CONFIG = {
            towers: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'],
            floors: 22,
            flatsPerFloor: 4,
            
            isValidFlat: function(tower, flatNumber) {
                const flatNum = parseInt(flatNumber);
                if (isNaN(flatNum)) return false;
                const floor = Math.floor(flatNum / 100);
                const flatPos = flatNum % 100;
                if (floor < 1 || floor > this.floors) return false;
                if (flatPos < 1 || flatPos > this.flatsPerFloor) return false;
                if (!this.towers.includes(tower)) return false;
                return true;
            }
        };
        
        // Admin emails - Add RWA member emails here
        const ADMIN_EMAILS = ["anjanib21@gmail.com", "admin@amaatra.com"];
        
        function isAdminUser(email) {
            return ADMIN_EMAILS.includes(email);
        }
        
        function showToast(msg) {
            let toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function showConfirmDialog(message, onConfirm, onCancel) {
            const dialog = document.getElementById('customDialog');
            const msgSpan = document.getElementById('dialogMsg');
            const confirmBtn = document.getElementById('dialogConfirm');
            const cancelBtn = document.getElementById('dialogCancel');
            
            msgSpan.textContent = message;
            dialog.classList.add('show');
            
            const handleConfirm = () => {
                dialog.classList.remove('show');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                if (onConfirm) onConfirm();
            };
            
            const handleCancel = () => {
                dialog.classList.remove('show');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                if (onCancel) onCancel();
            };
            
            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }
        
        async function loadDataFromFirebase() {
            try {
                const usersSnap = await get(ref(db, 'users'));
                const slotsSnap = await get(ref(db, 'slots'));
                const bookingsSnap = await get(ref(db, 'bookings'));
                
                allUsers = usersSnap.exists() ? Object.values(usersSnap.val()) : [];
                allSlots = slotsSnap.exists() ? Object.values(slotsSnap.val()) : [];
                allBookings = bookingsSnap.exists() ? Object.values(bookingsSnap.val()) : [];
                
                localStorage.setItem('parkUsers', JSON.stringify(allUsers));
                localStorage.setItem('parkSlots', JSON.stringify(allSlots));
                localStorage.setItem('parkBookings', JSON.stringify(allBookings));
            } catch (error) {
                console.error("Error loading from Firebase:", error);
                allUsers = JSON.parse(localStorage.getItem('parkUsers') || '[]');
                allSlots = JSON.parse(localStorage.getItem('parkSlots') || '[]');
                allBookings = JSON.parse(localStorage.getItem('parkBookings') || '[]');
            }
        }
        
        async function saveToFirebase(path, id, data) {
            await set(ref(db, `${path}/${id}`), data);
        }
        
        async function updateInFirebase(path, data) {
            await update(ref(db, path), data);
        }
        
        async function removeFromFirebase(path) {
            await remove(ref(db, path));
        }
        
        async function addNotification(userId, title, message, type) {
            const notificationId = Date.now().toString();
            const notification = {
                id: notificationId,
                userId: userId,
                title: title,
                message: message,
                type: type,
                read: false,
                createdAt: new Date().toISOString()
            };
            await saveToFirebase('notifications', notificationId, notification);
            return notification;
        }
        
        async function loadNotificationsForUser(userId) {
            const notificationsSnap = await get(ref(db, 'notifications'));
            if (notificationsSnap.exists()) {
                const allNotifs = Object.values(notificationsSnap.val());
                allNotifications = allNotifs.filter(n => n.userId === userId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } else {
                allNotifications = [];
            }
            return allNotifications;
        }
        
        async function markNotificationAsRead(notificationId) {
            await updateInFirebase(`notifications/${notificationId}`, { read: true });
        }
        
        function getUnreadCount() {
            return allNotifications.filter(n => !n.read).length;
        }
        
        function isFlatRegistered(tower, flat) {
            return allUsers.some(u => u.tower === tower && u.flat === flat && u.status === 'approved');
        }
        
        // ============ FORGOT PASSWORD ============
        window.showForgotPassword = function() {
            closeModal('loginModal');
            document.getElementById('app').insertAdjacentHTML('beforeend', `
                <div id="forgotModal" class="modal active">
                    <div class="modal-content">
                        <h3 style="margin-bottom:16px;">🔐 Reset Password</h3>
                        <p style="margin-bottom:16px; color:#666; font-size:13px;">Enter your email address and we'll send you a link to reset your password.</p>
                        <div class="input-group"><label>Email Address</label><input type="email" id="resetEmail" placeholder="your@email.com"></div>
                        <button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Link</button>
                        <div style="text-align:center;margin-top:12px;"><span style="color:#667eea;cursor:pointer;" onclick="closeModal('forgotModal');showLoginModal()">Back to Login</span></div>
                    </div>
                </div>
            `);
        };
        
        window.sendPasswordReset = async function() {
            const email = document.getElementById('resetEmail').value;
            if (!email) { showToast('Please enter your email'); return; }
            
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('✅ Password reset email sent! Check your inbox.');
                closeModal('forgotModal');
                setTimeout(() => showLoginModal(), 2000);
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/user-not-found') {
                    showToast('No account found with this email address.');
                } else {
                    showToast('Failed to send reset email. Try again.');
                }
            }
        };
        
        // ============ SECURITY FUNCTIONS ============
        function renderSecurityDashboard() {
            const pendingBookings = allBookings.filter(b => b.status === 'active' && !b.entryLogged);
            
            document.getElementById('app').innerHTML = `
                <div class="app-container">
                    <div class="header"><div class="flex-between"><div><h1>🛡️ ParkAmaatra</h1><div class="header-sub">Security Dashboard | सुरक्षा डैशबोर्ड</div></div><button class="btn-secondary" style="width:auto;padding:8px 16px;" onclick="logoutSecurity()">Logout</button></div></div>
                    <div class="nav-tabs"><button class="nav-tab active" onclick="showSecurityTab('code')">🔢 Verify Code</button><button class="nav-tab" onclick="showSecurityTab('pending')">⏳ Pending (${pendingBookings.length})</button><button class="nav-tab" onclick="showSecurityTab('search')">🔍 Search</button><button class="nav-tab" onclick="showSecurityTab('history')">📜 History</button></div>
                    <div id="codeTab" style="padding:0 16px;"><div class="card"><div class="card-title">🔢 Enter 6-Digit Booking Code</div><input type="text" id="verifyCode" placeholder="Enter code" maxlength="6" style="width:100%;padding:16px;font-size:24px;text-align:center;letter-spacing:4px;border:1px solid #e2e8f0;border-radius:12px;"><button class="btn btn-primary" style="margin-top:16px;" onclick="verifyCode()">Verify & Allow Entry</button><div id="verifyResult"></div></div></div>
                    <div id="pendingTab" style="display:none;padding:0 16px;"><div class="card"><div class="card-title">⏳ Pending Entries (${pendingBookings.length})</div>${pendingBookings.length === 0 ? '<div class="empty-state">No pending entries</div>' : pendingBookings.map(b => `<div class="slot-card"><div><strong>🚗 ${b.guestCar}</strong> | 📍 ${b.slotNumber}</div><div>👤 ${b.guestName} | 📞 ${b.guestMobile}</div><div>🏢 Host: ${b.hostName} (${b.hostFlat})</div><div>🔑 Code: ${b.bookingCode}</div><div>⏰ Valid until: ${new Date(b.endTime).toLocaleString()}</div><button class="btn btn-primary" style="margin-top:8px;" onclick="allowEntry('${b.id}')">✅ Allow Entry</button></div>`).join('')}</div></div>
                    <div id="searchTab" style="display:none;padding:0 16px;"><div class="card"><div class="card-title">🔍 Search Bookings</div><div class="input-group"><label>Search by Vehicle, Name, or Phone</label><input type="text" id="searchInput" placeholder="Enter vehicle number, guest name, parking owner name, booked by name, or phone (last 4 digits)" onkeyup="searchBookings()"></div><div id="searchResults"></div></div></div>
                    <div id="historyTab" style="display:none;padding:0 16px;"><div class="card"><div class="card-title">📜 Entry History</div><div id="securityHistory"></div></div></div>
                    <div class="footer">Developed by <strong>ArandaTech Solution</strong></div>
                </div>
            `;
            loadSecurityHistory();
        }
        
        window.verifyCode = function() {
            const code = document.getElementById('verifyCode').value.trim();
            const resultDiv = document.getElementById('verifyResult');
            if (!code || code.length !== 6) { resultDiv.innerHTML = '<div style="color:#f56565;margin-top:12px;">❌ Enter 6-digit code</div>'; return; }
            const booking = allBookings.find(b => b.bookingCode == code && b.status === 'active');
            if (!booking) { resultDiv.innerHTML = '<div style="color:#f56565;margin-top:12px;">❌ Invalid or expired code</div>'; return; }
            if (booking.entryLogged) {
                resultDiv.innerHTML = `<div style="background:#d4edda;padding:12px;border-radius:12px;margin-top:12px;"><div style="color:#155724;">✅ ENTRY ALREADY GRANTED at ${new Date(booking.entryTime).toLocaleString()}</div></div>`;
                return;
            }
            resultDiv.innerHTML = `<div style="background:#d4edda;padding:12px;border-radius:12px;margin-top:12px;"><h3 style="color:#155724;">✅ VALID BOOKING</h3><div><strong>🚗 Vehicle:</strong> ${booking.guestCar}</div><div><strong>👤 Guest:</strong> ${booking.guestName}</div><div><strong>📞 Guest Phone:</strong> ${booking.guestMobile}</div><div><strong>📍 Slot:</strong> ${booking.slotNumber}</div><div><strong>🏢 Host:</strong> ${booking.hostName} (${booking.hostFlat})</div><div><strong>📅 Booked by:</strong> ${booking.bookedByName} (${booking.bookedByFlat})</div><div><strong>⏰ Booking period:</strong> ${new Date(booking.startTime).toLocaleString()} → ${new Date(booking.endTime).toLocaleString()}</div><button class="btn btn-primary" style="margin-top:12px;" onclick="allowEntry('${booking.id}')">✅ ALLOW ENTRY</button></div>`;
        };
        
        window.allowEntry = async function(bookingId) {
            const booking = allBookings.find(b => b.id === bookingId);
            if (booking && !booking.entryLogged) {
                booking.entryLogged = true;
                booking.entryTime = new Date().toISOString();
                await updateInFirebase(`bookings/${booking.id}`, { entryLogged: true, entryTime: booking.entryTime });
                showToast(`✅ Entry allowed for ${booking.guestCar}`);
                await loadDataFromFirebase();
                renderSecurityDashboard();
            }
        };
        
        function loadSecurityHistory() {
            const div = document.getElementById('securityHistory');
            if (!div) return;
            const entries = allBookings.filter(b => b.entryLogged === true).slice(-20).reverse();
            if (entries.length === 0) { div.innerHTML = '<div class="empty-state">No entries yet</div>'; return; }
            div.innerHTML = entries.map(b => `<div class="slot-card"><div><strong>🚗 ${b.guestCar}</strong> | 📍 ${b.slotNumber}</div><div>👤 ${b.guestName} | 📞 ${b.guestMobile}</div><div>🏢 Host: ${b.hostName} (${b.hostFlat})</div><div>⏰ ${new Date(b.startTime).toLocaleString()} → ${new Date(b.endTime).toLocaleString()}</div><div>✅ Entry: ${new Date(b.entryTime).toLocaleString()}</div></div>`).join('');
        }
        
        function searchBookings() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');
            if (searchTerm === '') { resultsDiv.innerHTML = '<div class="empty-state">Enter search term</div>'; return; }
            const results = allBookings.filter(b => b.guestCar.toLowerCase().includes(searchTerm) || b.guestName.toLowerCase().includes(searchTerm) || b.hostName.toLowerCase().includes(searchTerm) || b.bookedByName.toLowerCase().includes(searchTerm));
            if (results.length === 0) { resultsDiv.innerHTML = '<div class="empty-state">No matching bookings found</div>'; return; }
            resultsDiv.innerHTML = results.map(b => `<div class="slot-card"><div><strong>🚗 ${b.guestCar}</strong> | 📍 ${b.slotNumber}</div><div>👤 ${b.guestName} | 📞 ${b.guestMobile}</div><div>🏢 Host: ${b.hostName}</div><div>🔑 Code: ${b.bookingCode}</div></div>`).join('');
        }
        
        window.showSecurityTab = function(tab) {
            document.getElementById('codeTab').style.display = 'none';
            document.getElementById('pendingTab').style.display = 'none';
            document.getElementById('searchTab').style.display = 'none';
            document.getElementById('historyTab').style.display = 'none';
            document.getElementById(tab + 'Tab').style.display = 'block';
            if (tab === 'history') loadSecurityHistory();
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
        };
        
        window.logoutSecurity = function() {
            isSecurityLoggedIn = false;
            currentMode = 'resident';
            showToast('Security logged out');
            renderApp();
        };
        
        // ============ NOTIFICATION CENTER ============
        function renderNotificationCenter() {
            const unreadCount = getUnreadCount();
            document.getElementById('app').insertAdjacentHTML('beforeend', `
                <div id="notificationModal" class="modal active">
                    <div class="modal-content">
                        <div class="notification-header"><h3>🔔 Notifications</h3>${unreadCount > 0 ? `<span class="mark-all-read" onclick="markAllAsRead()">Mark all as read</span>` : ''}</div>
                        <div id="notificationsList">${allNotifications.length === 0 ? '<div class="empty-state">No notifications</div>' : allNotifications.map(n => `<div class="notification-item ${!n.read ? 'unread' : ''}" onclick="markAsReadAndClose('${n.id}')"><div><strong>${n.title}</strong></div><div style="font-size:13px;">${n.message}</div><div class="time">${new Date(n.createdAt).toLocaleString()}</div></div>`).join('')}</div>
                        <button class="btn-secondary" style="margin-top:12px;" onclick="closeModal('notificationModal')">Close</button>
                    </div>
                </div>
            `);
        }
        
        window.showNotifications = async function() {
            await loadNotificationsForUser(currentUser.id);
            renderNotificationCenter();
        };
        
        window.markAsReadAndClose = async function(notificationId) {
            await markNotificationAsRead(notificationId);
            closeModal('notificationModal');
            renderApp();
        };
        
        window.markAllAsRead = async function() {
            const notificationsSnap = await get(ref(db, 'notifications'));
            if (notificationsSnap.exists()) {
                const allNotifs = Object.values(notificationsSnap.val());
                const userNotifs = allNotifs.filter(n => n.userId === currentUser.id && !n.read);
                for (const notif of userNotifs) {
                    await updateInFirebase(`notifications/${notif.id}`, { read: true });
                }
            }
            closeModal('notificationModal');
            renderApp();
        };
        
        // ============ GUEST VIEW ============
        function renderGuestView() {
            const availableSlots = allSlots.filter(s => s.status === 'available');
            document.getElementById('app').innerHTML = `

        window.loginWithEmail = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showToast('Enter email and password'); return; }
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = allUsers.find(u => u.email === email);
                if (!user) { showToast('Account not found. Please sign up first.'); return; }
                if (user.status === 'pending') { showToast('⚠️ Your account is pending admin approval.'); await signOut(auth); return; }
                if (user.status === 'rejected') { showToast('❌ Your registration was rejected. Contact admin.'); await signOut(auth); return; }
                
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                closeModal('loginModal');
                await loadNotificationsForUser(currentUser.id);
                showToast(`Welcome back ${user.name}!`);
                await loadDataFromFirebase();
                renderApp();
            } catch (error) {
                console.error(error);
                showToast('Login failed. Check your email/password.');
            }
        };
        
        window.signup = async function() {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const tower = document.getElementById('signupTower').value;
            const flat = document.getElementById('signupFlat').value;
            const hasCar = document.getElementById('signupHasCar').value;
            const slotsRaw = document.getElementById('signupSlots').value;
            
            if (!name || !email || !password || !tower || !flat) { showToast('Please fill all fields'); return; }
            if (password.length < 6) { showToast('Password must be at least 6 characters'); return; }
            if (!SOCIETY_CONFIG.isValidFlat(tower, flat)) { showToast(`Invalid flat number! Flat must be between 101-2204 for Tower ${tower}. Example: 1104`); return; }
            if (isFlatRegistered(tower, flat)) { showToast(`Flat ${tower}-${flat} is already registered. Contact admin if this is incorrect.`); return; }
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const newUser = { id: userCredential.user.uid, name, email, mobile: email, tower, flat, hasCar: hasCar === 'yes', parkingSlots: slotsRaw ? slotsRaw.split(',').map(s => s.trim()) : [], status: 'pending', createdAt: new Date().toISOString() };

                allUsers.push(newUser);
                
                for (const adminEmail of ADMIN_EMAILS) {

                    if (adminUser) { await addNotification(adminUser.id, '🆕 New Registration Request', `${name} (${tower}-${flat}) has requested to join.`, 'admin'); }

                closeModal('signupModal');

                renderApp();
            } catch (error) { showToast('Signup failed. Email may already exist.'); }

        window.confirmBooking = async function(slotId) {

            });
        };
        
        // ============ MAIN RENDER ============
        async function renderApp() {
            if (currentMode === 'security' && isSecurityLoggedIn) { renderSecurityDashboard(); }
            else if (currentMode === 'security') { renderGuestView(); }
            else if (currentUser) {
                await loadNotificationsForUser(currentUser.id);
                const isAdmin = isAdminUser(currentUser.email);
                if (isAdmin && adminMode === 'admin') { renderAdminPanel(); }
                else { renderResidentApp(); }
            } else { renderGuestView(); }
        }
        
        // Initialize
        onAuthStateChanged(auth, async (user) => {
            await loadDataFromFirebase();
            if (user) {
                const existingUser = allUsers.find(u => u.email === user.email);
                if (existingUser && existingUser.status === 'approved') {
                    currentUser = existingUser;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    const savedMode = localStorage.getItem('adminMode');
                    adminMode = (savedMode === 'resident' || savedMode === 'admin') ? savedMode : 'admin';
                } else if (existingUser && existingUser.status === 'pending') { showToast('Your account is pending admin approval.'); await signOut(auth); }
                else if (existingUser && existingUser.status === 'rejected') { showToast('Your registration was rejected. Contact admin.'); await signOut(auth); }
            } else {
                const saved = localStorage.getItem('currentUser');
                if (saved) { currentUser = JSON.parse(saved); const exists = allUsers.find(u => u.id === currentUser.id && u.status === 'approved'); if (!exists) currentUser = null; }
            }
            renderApp();
        });
        
        loadDataFromFirebase().then(() => {
            const saved = localStorage.getItem('currentUser');
            if (saved) { currentUser = JSON.parse(saved); const exists = allUsers.find(u => u.id === currentUser.id && u.status === 'approved'); if (!exists) currentUser = null; }
            renderApp();
        });
    </script>
    <div id="app"></div>
    <div id="toastMsg" class="toast"></div>
    <div id="customDialog" class="custom-toast"><p id="dialogMsg"></p><div><button id="dialogConfirm" class="btn-primary" style="width:auto;padding:8px 20px;">Confirm</button><button id="dialogCancel" class="btn-secondary" style="width:auto;padding:8px 20px;">Cancel</button></div></div>
</body>
</html>
