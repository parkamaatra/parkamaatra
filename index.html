    <script type="module">
        import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        
        const db = getDatabase();

        let currentUser = null;
        let currentMode = 'resident';

        let isSecurityLoggedIn = false;
        let allUsers = [];
        let allSlots = [];
        let allBookings = [];
        let allNotifications = [];

        const SECURITY_PASSWORD = "amaatra123";
        const RENTAL_PRICES = { daily: 50, weekly: 300, monthly: 1000 };
        
        // ============ SOCIETY CONFIGURATION ============
        const SOCIETY_CONFIG = {
            towers: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'],
            floors: 22,
            flatsPerFloor: 4,
            
            isValidFlat: function(tower, flatNumber) {
                const flatNum = parseInt(flatNumber);
                if (isNaN(flatNum)) return false;
                const floor = Math.floor(flatNum / 100);
                const flatPos = flatNum % 100;
                if (floor < 1 || floor > this.floors) return false;
                if (flatPos < 1 || flatPos > this.flatsPerFloor) return false;
                if (!this.towers.includes(tower)) return false;
                return true;
            }
        };
        
        // Admin emails
        const ADMIN_EMAILS = ["anjanib21@gmail.com", "admin@amaatra.com"];
        
        function isAdminUser(email) {
            return ADMIN_EMAILS.includes(email);
        }
        
        function showToast(msg) {
            let toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        function showConfirmDialog(message, onConfirm, onCancel) {
            const dialog = document.getElementById('customDialog');
            const msgSpan = document.getElementById('dialogMsg');
            const confirmBtn = document.getElementById('dialogConfirm');
            const cancelBtn = document.getElementById('dialogCancel');
            
            msgSpan.textContent = message;
            dialog.classList.add('show');
            
            const handleConfirm = () => {
                dialog.classList.remove('show');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                if (onConfirm) onConfirm();
            };
            
            const handleCancel = () => {
                dialog.classList.remove('show');
                confirmBtn.removeEventListener('click', handleConfirm);
                cancelBtn.removeEventListener('click', handleCancel);
                if (onCancel) onCancel();
            };
            
            confirmBtn.addEventListener('click', handleConfirm);
            cancelBtn.addEventListener('click', handleCancel);
        }
        
        async function loadDataFromFirebase() {
            try {
                const usersSnap = await get(ref(db, 'users'));
                const slotsSnap = await get(ref(db, 'slots'));
                const bookingsSnap = await get(ref(db, 'bookings'));
                
                allUsers = usersSnap.exists() ? Object.values(usersSnap.val()) : [];
                allSlots = slotsSnap.exists() ? Object.values(slotsSnap.val()) : [];
                allBookings = bookingsSnap.exists() ? Object.values(bookingsSnap.val()) : [];
                
                localStorage.setItem('parkUsers', JSON.stringify(allUsers));
                localStorage.setItem('parkSlots', JSON.stringify(allSlots));
                localStorage.setItem('parkBookings', JSON.stringify(allBookings));
            } catch (error) {
                console.error("Error loading from Firebase:", error);
                allUsers = JSON.parse(localStorage.getItem('parkUsers') || '[]');
                allSlots = JSON.parse(localStorage.getItem('parkSlots') || '[]');
                allBookings = JSON.parse(localStorage.getItem('parkBookings') || '[]');
            }
        }
        
        async function saveToFirebase(path, id, data) {
            await set(ref(db, `${path}/${id}`), data);
        }
        
        async function updateInFirebase(path, data) {
            await update(ref(db, path), data);
        }
        
        async function removeFromFirebase(path) {
            await remove(ref(db, path));
        }
        
        async function addNotification(userId, title, message, type) {
            const notificationId = Date.now().toString();
            const notification = {
                id: notificationId,
                userId: userId,
                title: title,
                message: message,
                type: type,
                read: false,
                createdAt: new Date().toISOString()
            };
            await saveToFirebase('notifications', notificationId, notification);
            return notification;
        }
        
        async function loadNotificationsForUser(userId) {
            const notificationsSnap = await get(ref(db, 'notifications'));
            if (notificationsSnap.exists()) {
                const allNotifs = Object.values(notificationsSnap.val());
                allNotifications = allNotifs.filter(n => n.userId === userId).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            } else {
                allNotifications = [];
            }
            return allNotifications;
        }
        
        async function markNotificationAsRead(notificationId) {
            await updateInFirebase(`notifications/${notificationId}`, { read: true });
        }
        
        function getUnreadCount() {
            return allNotifications.filter(n => !n.read).length;
        }
        
        function isFlatRegistered(tower, flat) {
            return allUsers.some(u => u.tower === tower && u.flat === flat && u.status === 'approved');
        }
        
        // ============ BOOKING EXPIRY CHECK (runs every minute) ============
        async function checkAndExpireBookings() {
            const now = new Date();
            let expiredCount = 0;
            
            for (let booking of allBookings) {
                if (booking.status === 'active' && !booking.entryLogged) {
                    const endTime = new Date(booking.endTime);
                    // Add 1 hour grace period
                    const expiryTime = new Date(endTime.getTime() + 60 * 60 * 1000);
                    
                    if (now > expiryTime) {
                        booking.status = 'expired';
                        await updateInFirebase(`bookings/${booking.id}`, { status: 'expired' });
                        
                        // Return the slot to available
                        const slot = allSlots.find(s => s.id === booking.slotId);
                        if (slot && slot.status === 'booked') {
                            slot.status = 'available';
                            await updateInFirebase(`slots/${slot.id}`, { status: 'available' });
                            
                            // Notify the parking owner
                            await addNotification(slot.hostId, '🔄 Your Slot is Available Again', `Your slot ${slot.slotNumber} is now available for booking. The previous booking expired without entry.`, 'expiry');
                        }
                        expiredCount++;
                    }
                }
            }
            
            if (expiredCount > 0) {
                console.log(`Expired ${expiredCount} bookings`);
                await loadDataFromFirebase();
                if (currentMode === 'security' && isSecurityLoggedIn) {
                    renderSecurityDashboard();
                } else if (currentUser) {
                    renderResidentApp();
                }
            }
        }
        
        // Start expiry checker
        if (expiryInterval) clearInterval(expiryInterval);
        expiryInterval = setInterval(() => {
            checkAndExpireBookings();
        }, 60000); // Check every minute
        
        // ============ FORGOT PASSWORD ============
        window.showForgotPassword = function() {

            document.getElementById('app').insertAdjacentHTML('beforeend', `
                <div id="forgotModal" class="modal active">

                        <div class="input-group"><label>Email Address</label><input type="email" id="resetEmail" placeholder="your@email.com"></div>
                        <button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Link</button>
                        <div style="text-align:center;margin-top:12px;"><span style="color:#667eea;cursor:pointer;" onclick="closeModal('forgotModal');showLoginModal()">Back to Login</span></div>
                    </div>
                </div>
            `);
        };
        
        window.sendPasswordReset = async function() {
            const email = document.getElementById('resetEmail').value;
            if (!email) { showToast('Please enter your email'); return; }
            
            try {
                await sendPasswordResetEmail(auth, email);
                showToast('✅ Password reset email sent! Check your inbox.');
                closeModal('forgotModal');
                setTimeout(() => showLoginModal(), 2000);
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/user-not-found') {
                    showToast('No account found with this email address.');
                } else {
                    showToast('Failed to send reset email. Try again.');
                }
            }
        };

            const activeBookings = allBookings.filter(b => b.status === 'active' && b.entryLogged === true && !b.exitLogged);
            const completedBookings = allBookings.filter(b => b.entryLogged === true && b.exitLogged === true);
            
            document.getElementById('app').innerHTML = `

                    <div class="security-stats">

        function renderBookingCard(b, showAllowEntry = false) {
            const isExpired = b.status === 'expired';
            const isPending = !b.entryLogged && b.status === 'active';
            const isOccupied = b.entryLogged === true && !b.exitLogged;
            const isCompleted = b.entryLogged === true && b.exitLogged === true;
            
            let statusColor = '';
            let statusIcon = '';
            let statusText = '';
            
            if (isExpired) {
                statusColor = 'status-expired';
                statusIcon = '⚫';
                statusText = 'Expired';
            } else if (isPending) {
                statusColor = 'status-booked';
                statusIcon = '🟡';
                statusText = 'Booked (Pending)';
            } else if (isOccupied) {
                statusColor = 'status-occupied';
                statusIcon = '🔴';
                statusText = 'Occupied';
            } else if (isCompleted) {
                statusColor = 'status-available';
                statusIcon = '✅';
                statusText = 'Completed';
            } else {
                statusColor = 'status-available';
                statusIcon = '🟢';
                statusText = 'Available';
            }
            
            const bookedByUser = allUsers.find(u => u.id === b.bookedBy);

        window.markExit = async function(bookingId) {

        window.performSearch = function() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('searchResults');
            
            if (searchTerm === '') {
                resultsDiv.innerHTML = '<div class="empty-state">Enter search term</div>';
                return;
            }
            
            const results = allBookings.filter(b => {
                const guestCar = b.guestCar.toLowerCase();
                const guestName = b.guestName.toLowerCase();
                const guestMobile = b.guestMobile;
                const hostName = b.hostName.toLowerCase();
                const bookedByName = b.bookedByName.toLowerCase();
                const slotNumber = b.slotNumber.toLowerCase();
                const bookingCode = b.bookingCode.toString();
                const guestCarLast4 = guestCar.slice(-4);
                const guestMobileLast4 = guestMobile.slice(-4);
                
                return guestCar.includes(searchTerm) ||
                       guestCarLast4 === searchTerm ||
                       guestName.includes(searchTerm) ||
                       guestMobile.includes(searchTerm) ||
                       guestMobileLast4 === searchTerm ||
                       hostName.includes(searchTerm) ||
                       bookedByName.includes(searchTerm) ||
                       slotNumber.includes(searchTerm) ||
                       bookingCode.includes(searchTerm);
            });
            
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">No matching bookings found</div>';
                return;

        window.rentOutParking = async function() {
            const slotNumber = document.getElementById('rentalSlotNumber')?.value;

            const days = parseInt(document.getElementById('rentalDays')?.value);
            
            if (!slotNumber || !startDate || !days) { showToast('Please fill all fields'); return; }
            if (days < 7) { showToast('⚠️ Minimum rental period is 7 days'); return; }
            
            const endDate = new Date(startDate);
            endDate.setDate(endDate.getDate() + days);
            endDate.setHours(23, 59, 59);

                startTime: new Date(startDate).toISOString(), 
                endTime: endDate.toISOString(), 
                status: 'available', 
                rentalType: 'custom',
                rentalDays: days,
                price: totalPrice, 
                createdAt: new Date().toISOString() 
            };
            await saveToFirebase('slots', slot.id, slot);
            showToast(`✅ Listed for rent! Price: ₹${totalPrice} for ${days} days`);

            renderApp();

                window.bookSlot = function(slotId) {
            const slot = allSlots.find(s => s.id === slotId);
            if (!slot || slot.status !== 'available') { showToast('Slot not available'); return; }
            
            const now = new Date();
            const startTime = new Date(slot.startTime);
            const endTime = new Date(slot.endTime);
            const isRental = slot.price > 0;
            
            // Check if slot is already occupied (someone has entered)
            const activeOccupiedBooking = allBookings.find(b => b.slotId === slot.id && b.status === 'active' && b.entryLogged === true);
            if (activeOccupiedBooking) {
                showToast('⚠️ This slot is currently occupied. Cannot book.');
                return;
            }
            
            // Check if slot has expired
            if (now > endTime) {
                showToast('⚠️ This slot has expired. Cannot book.');
                return;
            }
            
            // For free slots, show warning if start time has passed but still allow booking
            let startWarning = '';
            if (!isRental && now > startTime) {
                startWarning = '<div style="background:#fff3cd; padding:12px; border-radius:12px; margin-bottom:12px; color:#856404;"><strong>⚠️ Note:</strong> This slot started at ' + startTime.toLocaleTimeString() + '. Please confirm your guest can still arrive.</div>';
            }
            
            if (isRental) {
                // Rental booking form
                const minDate = new Date(slot.startTime);
                const maxDate = new Date(slot.endTime);
                const today = new Date();
                const minSelectDate = minDate > today ? minDate : today;
                
                const minDateStr = minSelectDate.toISOString().slice(0, 10);
                const maxDateStr = maxDate.toISOString().slice(0, 10);
                const perDayPrice = slot.price / slot.rentalDays;
                
                document.getElementById('app').insertAdjacentHTML('beforeend', `
                    <div id="bookModal" class="modal active">
                        <div class="modal-content" style="max-width: 380px;">
                            <h3>🚗 Rent Parking Slot - ${slot.slotNumber}</h3>
                            <div style="background:#f0f2f5; padding:12px; border-radius:12px; margin-bottom:16px;">
                                <div><strong>📅 Available Period:</strong> ${minDate.toLocaleDateString()} - ${maxDate.toLocaleDateString()}</div>
                                <div><strong>💰 Price:</strong> ₹${perDayPrice} per day</div>
                            </div>
                            
                            <div class="input-group">
                                <label>Book for:</label>
                                <select id="bookingFor" onchange="toggleRentalGuestFields()">
                                    <option value="self">Myself (I will use the parking)</option>
                                    <option value="guest">My Guest</option>
                                </select>
                            </div>
                            
                            <div id="rentalSelfFields">
                                <div class="input-group"><label>Your Car Number</label><input type="text" id="selfCar" placeholder="Enter your car number"></div>
                                <div class="input-group"><label>Your Mobile Number</label><input type="tel" id="selfMobile" placeholder="10-digit mobile number"></div>
                            </div>
                            
                            <div id="rentalGuestFields" style="display:none;">
                                <div class="input-group"><label>Guest Name</label><input type="text" id="guestName" placeholder="Enter guest name"></div>
                                <div class="input-group"><label>Guest Car Number</label><input type="text" id="guestCar" placeholder="Enter guest car number"></div>
                                <div class="input-group"><label>Guest Mobile Number</label><input type="tel" id="guestMobile" placeholder="10-digit mobile number"></div>
                            </div>
                            
                            <div class="input-group">
                                <label>Start Date</label>
                                <input type="date" id="rentalStartDate" min="${minDateStr}" value="${minDateStr}" onchange="updateRentalPriceByDates(${perDayPrice})">
                            </div>
                            
                            <div class="input-group">
                                <label>End Date</label>
                                <input type="date" id="rentalEndDate" min="${minDateStr}" value="${minDateStr}" onchange="updateRentalPriceByDates(${perDayPrice})">
                            </div>
                            
                            <div class="input-group">
                                <label>Total Price</label>
                                <input type="text" id="rentalTotalPrice" readonly style="background:#f7fafc; font-weight:bold; color:#9c27b0;">
                            </div>
                            
                            <button class="btn btn-primary" onclick="confirmRentalBookingWithDates('${slotId}', ${perDayPrice})">✅ Confirm Rental</button>
                            <button class="btn-secondary" style="margin-top:8px;" onclick="closeBookModal()">Cancel</button>
                        </div>
                    </div>
                `);
                const startDateInput = document.getElementById('rentalStartDate');
                const endDateInput = document.getElementById('rentalEndDate');
                if (startDateInput && endDateInput) {
                    const defaultEnd = new Date(startDateInput.value);
                    defaultEnd.setDate(defaultEnd.getDate() + 1);
                    endDateInput.value = defaultEnd.toISOString().slice(0, 10);
                }
                updateRentalPriceByDates(perDayPrice);
            } else {
                // Free booking form
                document.getElementById('app').insertAdjacentHTML('beforeend', `<div id="bookModal" class="modal active"><div class="modal-content"><h3>📝 Book for Guest</h3>
                    ${startWarning}
                    <div class="input-group"><label>Guest Name</label><input type="text" id="guestName"></div>
                    <div class="input-group"><label>Guest Car Number</label><input type="text" id="guestCar"></div>
                    <div class="input-group"><label>Guest Mobile Number</label><input type="tel" id="guestMobile"></div>
                    <button class="btn btn-primary" onclick="confirmGuestBooking('${slotId}')">Confirm Booking</button>
                    <button class="btn-secondary" style="margin-top:8px;" onclick="closeBookModal()">Cancel</button></div></div>`);
            }
        };
        
        window.updateRentalPriceByDates = function(perDayPrice) {
            const startDate = document.getElementById('rentalStartDate')?.value;
            const endDate = document.getElementById('rentalEndDate')?.value;
            const priceInput = document.getElementById('rentalTotalPrice');
            
            if (startDate && endDate) {
                const start = new Date(startDate);
                const end = new Date(endDate);
                const diffTime = Math.abs(end - start);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 1 && end >= start) {
                    const totalPrice = diffDays * perDayPrice;
                    priceInput.value = `₹${totalPrice} (${diffDays} days @ ₹${perDayPrice}/day)`;
                } else {
                    priceInput.value = `⚠️ End date must be after start date`;
                }
            } else {
                priceInput.value = '';
            }
        };
        
                window.confirmRentalBookingWithDates = async function(slotId, perDayPrice) {
            const bookingFor = document.getElementById('bookingFor')?.value;
            const startDate = document.getElementById('rentalStartDate')?.value;
            const endDate = document.getElementById('rentalEndDate')?.value;
            
            if (!startDate || !endDate) { showToast('Please select start and end dates'); return; }
            
            const start = new Date(startDate);
            const end = new Date(endDate);
            const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 1) {
                showToast('End date must be after start date');
                return;
            }
            
            const totalPrice = diffDays * perDayPrice;
            
            let guestName, guestCar, guestMobile;
            
            if (bookingFor === 'self') {
                guestName = currentUser.name;
                guestCar = document.getElementById('selfCar')?.value;
                guestMobile = document.getElementById('selfMobile')?.value;
            } else {
                guestName = document.getElementById('guestName')?.value;
                guestCar = document.getElementById('guestCar')?.value;
                guestMobile = document.getElementById('guestMobile')?.value;
            }
            
            if (!guestCar || !guestMobile) { showToast('Fill all fields'); return; }
            if (guestMobile.length !== 10) { showToast('Enter valid 10-digit mobile'); return; }
            
            const slot = allSlots.find(s => s.id === slotId);
            if (!slot || slot.status !== 'available') { showToast('Slot not available'); return; }
            
            const now = new Date();
            const slotEndTime = new Date(slot.endTime);
            
            // Check if slot is occupied
            const activeOccupiedBooking = allBookings.find(b => b.slotId === slot.id && b.status === 'active' && b.entryLogged === true);
            if (activeOccupiedBooking) {
                showToast('⚠️ This slot is currently occupied. Cannot book.');
                return;
            }
            
            if (now > slotEndTime) {
                showToast('⚠️ This rental period has expired. Cannot book.');
                return;
            }
            
            // Set end time to end of selected end date
            const newEndDate = new Date(endDate);
            newEndDate.setHours(23, 59, 59);
            
            const booking = { 
                id: Date.now().toString(), 
                slotId, 
                slotNumber: slot.slotNumber, 
                hostId: slot.hostId, 
                hostName: slot.hostName, 
                hostFlat: slot.hostFlat, 
                guestName, 
                guestCar, 
                guestMobile, 
                bookedBy: currentUser.id, 
                bookedByName: currentUser.name, 
                bookedByFlat: `${currentUser.tower}-${currentUser.flat}`,
                bookingType: 'rental',
                rentalDays: diffDays,
                startTime: new Date(startDate).toISOString(), 
                endTime: newEndDate.toISOString(),
                status: 'active', 
                bookingCode: Math.floor(100000 + Math.random() * 900000), 
                bookedAt: new Date().toISOString(), 
                entryLogged: false, 
                price: totalPrice
            };
            
            await saveToFirebase('bookings', booking.id, booking);
            await updateInFirebase(`slots/${slot.id}`, { status: 'booked' });
            
            const notificationMessage = `${currentUser.name} rented your slot ${slot.slotNumber} for ${diffDays} days (${startDate} to ${endDate}). Price: ₹${totalPrice}. ${bookingFor === 'self' ? 'For themselves' : `Guest: ${guestName} (${guestCar})`}`;
            await addNotification(slot.hostId, '📅 Your Slot Has Been Rented', notificationMessage, 'booking');
            
            showToast(`✅ Rental confirmed! Code: ${booking.bookingCode}`);
            closeBookModal();
            await loadDataFromFirebase();
            renderApp();
        };
        
        window.toggleRentalGuestFields = function() {
            const bookingFor = document.getElementById('bookingFor')?.value;
            const selfFields = document.getElementById('rentalSelfFields');
            const guestFields = document.getElementById('rentalGuestFields');

                selfFields.style.display = 'block';
                guestFields.style.display = 'none';
            } else {
                selfFields.style.display = 'none';
                guestFields.style.display = 'block';
            }
        };

        window.confirmRentalBooking = async function(slotId, perDayPrice) {
            const bookingFor = document.getElementById('bookingFor')?.value;
            const selectedDays = parseInt(document.getElementById('rentalDaysSelect')?.value);
            const totalPrice = selectedDays * perDayPrice;
            
            let guestName, guestCar, guestMobile;
            
            if (bookingFor === 'self') {
                guestName = currentUser.name;
                guestCar = document.getElementById('selfCar')?.value;
                guestMobile = document.getElementById('selfMobile')?.value;
            } else {
                guestName = document.getElementById('guestName')?.value;
                guestCar = document.getElementById('guestCar')?.value;
                guestMobile = document.getElementById('guestMobile')?.value;
            }
            
            if (!guestCar || !guestMobile) { showToast('Fill all fields'); return; }
            if (guestMobile.length !== 10) { showToast('Enter valid 10-digit mobile'); return; }
            
            const slot = allSlots.find(s => s.id === slotId);
            if (!slot || slot.status !== 'available') { showToast('Slot not available'); return; }
            
            const now = new Date();
            const endTime = new Date(slot.endTime);
            if (now > endTime) {
                showToast('⚠️ This rental period has expired. Cannot book.');
                return;
            }
            
            // Calculate new end date based on selected days
            const startDate = new Date(slot.startTime);
            const newEndDate = new Date(startDate);
            newEndDate.setDate(startDate.getDate() + selectedDays);
            
            const booking = { 
                id: Date.now().toString(), 
                slotId, 
                slotNumber: slot.slotNumber, 
                hostId: slot.hostId, 
                hostName: slot.hostName, 
                hostFlat: slot.hostFlat, 
                guestName, 
                guestCar, 
                guestMobile, 
                bookedBy: currentUser.id, 
                bookedByName: currentUser.name, 
                bookedByFlat: `${currentUser.tower}-${currentUser.flat}`,
                bookingType: 'rental',
                rentalDays: selectedDays,
                startTime: slot.startTime, 
                endTime: newEndDate.toISOString(),
                status: 'active', 
                bookingCode: Math.floor(100000 + Math.random() * 900000), 
                bookedAt: new Date().toISOString(), 
                entryLogged: false, 
                price: totalPrice
            };
            
            await saveToFirebase('bookings', booking.id, booking);
            await updateInFirebase(`slots/${slot.id}`, { status: 'booked' });
            
            const notificationMessage = `${currentUser.name} rented your slot ${slot.slotNumber} for ${selectedDays} days. Price: ₹${totalPrice}. ${bookingFor === 'self' ? 'For themselves' : `Guest: ${guestName} (${guestCar})`}`;
            await addNotification(slot.hostId, '📅 Your Slot Has Been Rented', notificationMessage, 'booking');
            
            showToast(`✅ Rental confirmed! Code: ${booking.bookingCode}`);
            closeBookModal();
            await loadDataFromFirebase();
            renderApp();
        };
        
                window.confirmGuestBooking = async function(slotId) {

            const guestMobile = document.getElementById('guestMobile')?.value;

            showToast(`✅ Booking confirmed! Code: ${booking.bookingCode}`);

        window.closeBookModal = function() { document.getElementById('bookModal')?.remove(); };
        
                window.confirmBooking = async function(slotId) {
            const guestName = document.getElementById('guestName')?.value;
            const guestCar = document.getElementById('guestCar')?.value;
            const guestMobile = document.getElementById('guestMobile')?.value;
            if (!guestName || !guestCar || !guestMobile) { showToast('Fill all fields'); return; }
            if (guestMobile.length !== 10) { showToast('Enter valid 10-digit mobile'); return; }
            const slot = allSlots.find(s => s.id === slotId);
            if (!slot || slot.status !== 'available') { showToast('Slot not available'); return; }
            
            const now = new Date();
            const startTime = new Date(slot.startTime);
            const endTime = new Date(slot.endTime);
            
            // For rental slots (with price) - can book anytime as long as not expired
            if (slot.price) {
                // Rental slot: only block if end time has passed
                if (now > endTime) {
                    showToast('⚠️ This rental period has expired. Cannot book.');
                    return;
                }
            } else {
                // Free slot: block if start time has passed
                if (now > startTime) {
                    showToast('⚠️ Cannot book a slot that has already started');
                    return;
                }
            }
            
            const booking = { id: Date.now().toString(), slotId, slotNumber: slot.slotNumber, hostId: slot.hostId, hostName: slot.hostName, hostFlat: slot.hostFlat, guestName, guestCar, guestMobile, bookedBy: currentUser.id, bookedByName: currentUser.name, bookedByFlat: `${currentUser.tower}-${currentUser.flat}`, startTime: slot.startTime, endTime: slot.endTime, status: 'active', bookingCode: Math.floor(100000 + Math.random() * 900000), bookedAt: new Date().toISOString(), entryLogged: false, price: slot.price };
            await saveToFirebase('bookings', booking.id, booking);
            await updateInFirebase(`slots/${slot.id}`, { status: 'booked' });
            await addNotification(slot.hostId, '📅 Your Slot Has Been Booked', `${currentUser.name} booked your slot ${slot.slotNumber} for guest ${guestName} (${guestCar}). Booking code: ${booking.bookingCode}`, 'booking');
            showToast(`✅ Booking confirmed! Code: ${booking.bookingCode}`);
            closeBookModal();
            await loadDataFromFirebase();
            renderApp();
        };
        
        window.logout = async function() {
            showConfirmDialog('Logout from ParkAmaatra?', async () => {
                currentUser = null;
                localStorage.removeItem('currentUser');
                localStorage.removeItem('userLoggedIn');
                localStorage.removeItem('securityLoggedIn');
                localStorage.removeItem('adminMode');
                await signOut(auth);
                showToast('Logged out');
                renderApp();
            });
        };
        
        // ============ MAIN RENDER ============
        async function renderApp() {
            const storedUser = localStorage.getItem('currentUser');
            const securitySession = localStorage.getItem('securityLoggedIn');
            
            if (securitySession === 'true' && !isSecurityLoggedIn) {
                isSecurityLoggedIn = true;
                currentMode = 'security';
                await loadDataFromFirebase();
                renderSecurityDashboard();
                return;
            }
            
            if (storedUser && !currentUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                    const exists = allUsers.find(u => u.id === currentUser.id);
                    if (exists) {
                        currentUser = exists;
                        await loadNotificationsForUser(currentUser.id);
                        const isAdmin = isAdminUser(currentUser.email);
                        if (isAdmin) {
                            const savedMode = localStorage.getItem('adminMode');
                            adminMode = (savedMode === 'resident' || savedMode === 'admin') ? savedMode : 'admin';
                        }
                        renderResidentApp();
                        return;
                    }
                } catch(e) { console.error(e); }
            }
            
            if (currentMode === 'security' && isSecurityLoggedIn) {
                renderSecurityDashboard();
            } else if (currentMode === 'security') {
                renderGuestView();
            } else if (currentUser) {
                await loadNotificationsForUser(currentUser.id);
                const isAdmin = isAdminUser(currentUser.email);
                if (isAdmin && adminMode === 'admin') {
                    renderAdminPanel();
                } else {
                    renderResidentApp();
                }
            } else {
                renderGuestView();
            }
        }
        
        // Initialize
        onAuthStateChanged(auth, async (user) => {
            await loadDataFromFirebase();
            
            const securitySession = localStorage.getItem('securityLoggedIn');
            if (securitySession === 'true') {
                isSecurityLoggedIn = true;
                currentMode = 'security';
                renderSecurityDashboard();
                return;
            }
            
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser && !user) {
                try {
                    const parsedUser = JSON.parse(storedUser);
                    const exists = allUsers.find(u => u.id === parsedUser.id);
                    if (exists) {
                        currentUser = exists;
                        const savedMode = localStorage.getItem('adminMode');
                        adminMode = (savedMode === 'resident' || savedMode === 'admin') ? savedMode : 'admin';
                        await loadNotificationsForUser(currentUser.id);
                        renderApp();
                        return;
                    }
                } catch(e) {}
            }
            
            if (user) {
                const existingUser = allUsers.find(u => u.email === user.email);
                if (existingUser) {
                    currentUser = existingUser;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    const savedMode = localStorage.getItem('adminMode');
                    adminMode = (savedMode === 'resident' || savedMode === 'admin') ? savedMode : 'admin';
                }
            }
            renderApp();
        });
        
        loadDataFromFirebase().then(() => {
            const securitySession = localStorage.getItem('securityLoggedIn');
            if (securitySession === 'true') {
                isSecurityLoggedIn = true;
                currentMode = 'security';
                renderSecurityDashboard();
                return;
            }
            
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                    const exists = allUsers.find(u => u.id === currentUser.id);
                    if (!exists) currentUser = null;
                } catch(e) { currentUser = null; }
            }
            renderApp();
        });
    </script>
